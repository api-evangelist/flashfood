aid: flashfood
name: Flashfood
description: >-
  Flashfood is a Toronto-based mobile marketplace that connects shoppers with
  heavily discounted groceries nearing their best-by date at partner grocery
  stores across the United States and Canada. Through its iOS and Android apps,
  shoppers browse deals of up to 50% off on fresh produce, meat, dairy, and
  packaged goods, pay in-app, and pick the items up at a dedicated Flashfood
  Zone in-store. By routing surplus food away from landfills and onto dinner
  tables, the company reduces grocery-retail food waste while helping families
  save on their grocery bills. Flashfood is a consumer-facing app and does not
  currently publish a public developer API, SDK, or developer portal; this
  profile captures its public web, legal, and security surface.
